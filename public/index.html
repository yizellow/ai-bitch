<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Single-Device AI Voice Robot</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="panel" aria-label="Single-device AI voice robot">
        <header class="header">
          <div class="title-group">
            <p class="eyebrow">Ritual Voice Interface</p>
            <h1>Single-Device AI Voice Robot</h1>
          </div>
          <div class="status" id="playbackStatus">Idle</div>
        </header>

        <section class="stage">
          <div class="messages-wrap">
            <div class="messages" id="messages" aria-live="polite"></div>
          </div>

          <aside class="queue-wrap" aria-label="Playback queue">
            <div class="queue-header">
              <h2>Playback Queue</h2>
              <div class="current" id="currentItem">Nothing is playing</div>
            </div>
            <ol class="queue" id="queueList"></ol>
          </aside>
        </section>

        <section class="input-dock" aria-label="Message input">
          <form class="composer" id="messageForm">
            <label class="input-label" for="messageInput">Leave a message</label>
            <textarea id="messageInput" name="text" rows="3" maxlength="200" placeholder="Type one sentence for the device"></textarea>
            <div class="composer-actions">
              <span id="charCount">0 / 200</span>
              <button id="submitButton" type="submit">Send</button>
            </div>
          </form>

          <section class="toolbar" aria-label="Toolbar">
            <label class="td-toggle hidden">
              <input type="checkbox" id="tdToggle">
              TouchDesigner
            </label>
            <button class="secondary" id="clearButton" type="button">Clear</button>
            <button class="secondary" id="clearAudioButton" type="button">Clear Audio Files</button>
          </section>
        </section>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
